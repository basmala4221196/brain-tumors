<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumor Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header id="header">
        <div class="header-photo">
            <img src="{{ url_for('static', filename='back2-transformed (1).jpeg') }}" alt="Header Photo">
        </div>
        <div class="header-content">
            <h1>Tumor Detection</h1>
        </div>
    </header>
    <section class="container">
        <div class="content">
            {% if message %}
            <p>{{ message }}</p>
            {% endif %}
            <form method="post" enctype="multipart/form-data" action="/predict">
                <input type="file" name="file" accept="image/*" required>
                <button type="submit">Predict</button>
            </form>
            {% if image_path %}
            <h2>Selected Image</h2>
            <img src="{{ url_for('static', filename='temp_image.jpg') }}" alt="Selected Image" width="300">
            <p>Predicted Tumor Type: {{ predicted_class }}</p>
            <p>Description: {{ description }}</p>
            <p>Confidence Score: {{ confidence_score }}</p>
            {% endif %}
        </div>
    </section>

    <script>
        window.addEventListener("scroll", function() {
            var header = document.getElementById("header");
            if (window.scrollY > 0) {
                header.classList.add("fixed");
            } else {
                header.classList.remove("fixed");
            }
        });
    </script>
</body>
</html>
